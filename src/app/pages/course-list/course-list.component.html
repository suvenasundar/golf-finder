<label for="search">Search:</label>
<input type="text" id="search" placeholder="course name or city" (input)="onSearch($event)">
<app-region-chip *ngFor="let r of regions" [region]="r" [selected]="r === selectedRegion" (picked)="selectedRegion = $event"></app-region-chip>
<a routerLink="/courses/new">+ Add course</a>
<ng-container *ngIf="courses$ | async as courses">
    <ng-container *ngIf="filteredCourses(courses) as shown">
        <p *ngIf="shown.length > 0">Showing {{shown.length}} {{shown.length ===1 ? 'course' : 'courses'}}</p>
        <p *ngIf="shown.length === 0">No Courses match your search</p>
        <div class="course-list">
            <app-course-card *ngFor="let course of shown" [course]="course"></app-course-card>
        </div>
    </ng-container>
</ng-container>
