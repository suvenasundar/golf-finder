<a [routerLink]="['/courses']">← All courses</a>
<p *ngIf="loading">Loading ...</p>
<div *ngIf="course$ | async as course">
    <h2>{{course.name}}</h2>
    <p>{{course.city}} . {{course.region}}</p>
    <p>{{course.holes}} holes . par {{course.par}}. rating {{course.rating}}</p>
    <h3>Location</h3>
    <p>{{course.address}}, {{course.city}}</p>
    <a [href]="mapUrl(course)" target="_blank" rel="noopener">Open in Google</a>
</div>

<p *ngIf="notFound"> course not found</p>
