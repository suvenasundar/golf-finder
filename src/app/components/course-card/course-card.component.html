<div class="course-card">
  <div class="course-card__location">
    <p class="course-card__name">{{course.name}}</p>
    <p class="course-card__city">{{course.city}}</p>
    <p>{{course.region}}</p>
  </div>

  <div class="course-card__details">
    <div class="course-hole_details">
      <p class="course-card__holes">{{course.holes}} holes</p>
      <p class="course-card__par">par {{course.par}}</p>
      <p class="course-card__rating">rating {{course.rating}}</p>
    </div>
    <div>
        <a [routerLink]="['/courses', course.id]">view details</a>
    </div>
  </div>
</div>
